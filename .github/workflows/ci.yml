name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only runs for pull requests into main, where it is a required check.
  # Deliberately not required on staging, where it never runs.
  branch-flow:
    name: main accepts staging only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any source but staging
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "::error::main accepts pull requests from staging only; this one is from '$HEAD_REF'. Merge it into staging first, then open staging → main."
            exit 1
          fi

  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest

    # A production build of the staging configuration, with placeholders only.
    # No real secret is needed: every driver is a fake, and the point of the
    # build step is to prove the client bundle cannot see a server secret:
    # ZULEX_API_KEY is a canary that must not appear in any client chunk.
    env:
      APP_ENV: staging
      APP_BASE_URL: https://ci.example.test
      CRON_SECRET: ci-placeholder-cron-secret
      PAYMENT_DRIVER: fake
      REGISTRATION_DRIVER: fake
      MAIL_DRIVER: console
      REPOSITORY_DRIVER: fake
      STORAGE_DRIVER: fake
      ZULEX_API_KEY: ci-canary-zulex-api-key-must-not-ship

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test -- --ci

      - run: npm run build

      - name: Client chunks carry no server secret
        run: |
          if grep -rqF "$ZULEX_API_KEY" .next/static; then
            echo "::error::The ZULEX_API_KEY canary is in the client bundle."
            exit 1
          fi
