name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only runs for pull requests into main, where it is a required check.
  # Deliberately not required on staging, where it never runs.
  branch-flow:
    name: main accepts staging only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any source but staging
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "::error::main accepts pull requests from staging only; this one is from '$HEAD_REF'. Merge it into staging first, then open staging → main."
            exit 1
          fi

  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest

    # A production build of the staging configuration, with placeholders only.
    # No real secret is needed: every driver is a fake, and the point of the
    # build step is to prove no server secret is baked into the build:
    # ZULEX_API_KEY is a canary that must appear nowhere in what .next serves.
    env:
      APP_ENV: staging
      APP_BASE_URL: https://ci.example.test
      CRON_SECRET: ci-placeholder-cron-secret
      PAYMENT_DRIVER: fake
      REGISTRATION_DRIVER: fake
      MAIL_DRIVER: console
      REPOSITORY_DRIVER: fake
      STORAGE_DRIVER: fake
      ZULEX_API_KEY: ci-canary-zulex-api-key-must-not-ship

    # Same major version as Supabase. Rehearses every migration and runs the
    # Postgres contract suite, which fails here if TEST_DATABASE_URL is unset.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # database-migrations skill: up, down, up must all succeed, through the
      # same commands the Vercel build runs; seeding twice must add nothing.
      - name: Migration rehearsal
        env:
          APP_ENV: dev
          REPOSITORY_DRIVER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          DIRECT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          CODES_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          npm run db:migrate
          npm run db:migrate:down -- all
          npm run db:migrate
          npm run db:seed
          npm run --silent db:seed | grep -Fx "Seed already loaded."

      - run: npm test -- --ci
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - run: npm run build

      # Next reads server variables at runtime, so the canary belongs nowhere in the build: not in client
      # chunks, and not in a prerendered page's HTML or RSC payload, which is served to every visitor.
      # .next/cache is Turbopack's build cache, which stores the build's environment and is never served.
      - name: The build carries no server secret
        run: |
          if grep -rlF --exclude-dir=cache "$ZULEX_API_KEY" .next; then
            echo "::error::The ZULEX_API_KEY canary is in the build output above."
            exit 1
          fi
